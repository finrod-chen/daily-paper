name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "scripts/**"
      - "schema/**"
      - "site.config.json"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# 同一時間只跑一次部署；後到的排隊（不取消進行中的部署）。
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secrets / variables
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::缺少 Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ -n "$CF_PROJECT" ] || { echo "::error::缺少 Variable CF_PAGES_PROJECT"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }}
